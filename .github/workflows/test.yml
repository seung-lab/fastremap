name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "*"

jobs:
  run_tests:
    name: Test ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13.3", "3.14"]
        include:
          - os: ubuntu-24.04-arm
            python-version: "3.12"

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/checkout@v4

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          # Install Visual C++ Build Tools if needed
          choco install visualstudio2019buildtools -y --no-progress
          choco install visualstudio2019-workload-vctools -y --no-progress


      - name: Update pip
        run: |
          python -m pip install --upgrade pip
          python -m pip install cython numpy meson-python ninja

      - name: Compile (Windows)
        if: runner.os == 'Windows'
        # Select MSVC so the editable extension does not depend on MinGW DLLs.
        run: python -m pip install -v --group dev -e . --no-build-isolation --config-settings=setup-args=--vsenv

      - name: Compile
        if: runner.os != 'Windows'
        run: python -m pip install --group dev -e . --no-build-isolation

      - name: Test with pytest
        run: python -m pytest -v -x automated_test.py
